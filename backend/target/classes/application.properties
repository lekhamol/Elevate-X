server.port=8080
spring.application.name=ElevatorSafetyDigitalTwinBackend

# Primary Datasource: H2 Database in MySQL Compatibility Mode (Zero local setup required)
spring.datasource.url=jdbc:h2:mem:elevator_twin;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=true

# H2 Web Console (Access at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.elevatortwin=DEBUG

